# CİHAZ YÖNETİM BUTONLARI
button:
  - platform: restart
    name: "Cihazı Yeniden Başlat"
    id: yeniden_baslat
    icon: "mdi:restart"

  - platform: factory_reset
    name: "Fabrika Ayarlarına Sıfırla"
    id: fabrika_ayarlari
    icon: "mdi:restore"

  - platform: template
    name: "WiFi Ayarlarını Sıfırla (Kurulum Modu)"
    icon: "mdi:wifi-refresh"
    on_press:
      - logger.log: "WiFi ayarları temizleniyor ve Cihaz AP Modunda Yeniden Başlatılıyor..."
      - lambda: |-
          wifi::global_wifi_component->save_wifi_sta("", "");
      - delay: 500ms
      - button.press: yeniden_baslat

# ==============================================================================
# OTONOM KOMBİ VE TERMOSTAT KONTROL MOTORU (ESP32 İÇİNDE ÇALIŞIR)
# ==============================================================================
globals:
  - id: last_sensor_seen
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: sensor_ok
    type: bool
    restore_value: false
    initial_value: "false"
  - id: son_ham_sicaklik
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: last_relay_on_time
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: last_relay_off_time
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: motor_hazir
    type: bool
    restore_value: false
    initial_value: "false"
  - id: donma_acil
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sensor_stok
    type: bool
    restore_value: false
    initial_value: "false"
  # HA'dan girilen gizli değerler (flash'ta saklanır, HA'ya geri gönderilmez)
  - id: xiaomi_bindkey
    type: std::string
    restore_value: true
    max_restore_data_length: 32
    initial_value: '""'
  - id: ota_sifresi
    type: std::string
    restore_value: true
    max_restore_data_length: 63
    initial_value: '""'
  # Home Assistant'tan gelen son saat dilimi (POSIX TZ biçiminde)
  - id: ha_saat_dilimi
    type: std::string
    restore_value: true
    max_restore_data_length: 63
    initial_value: '""'
  - id: led_blink
    type: bool
    restore_value: false
    initial_value: "false"

interval:
  - interval: 10s
    then:
      - script.execute: termostat_kontrol

  # HA'nın gönderdiği saat dilimi yalnızca ha_time'a yazılır; SNTP her senkronda kendi
  # dilimini geri yüklediği için aynı dilim SNTP'ye de uygulanır ve flash'a kaydedilir.
  - interval: 60s
    then:
      - lambda: |-
          const std::string tz = id(ha_time).get_timezone();
          if (tz.empty() || tz.size() > 63 || tz == id(my_time).get_timezone())
            return;
          id(my_time).set_timezone(tz);
          id(ha_saat_dilimi) = tz;
          ESP_LOGI("time", "Saat dilimi Home Assistant'tan alındı: %s", tz.c_str());

  # Durum LED'i: Wi-Fi yoksa yanıp söner, bağlıyken kombi rölesinin durumunu gösterir.
  - interval: 500ms
    then:
      - lambda: |-
          if (id(button_hold_feedback).is_running())
            return;
          bool on;
          if (!wifi::global_wifi_component->is_connected()) {
            id(led_blink) = !id(led_blink);
            on = id(led_blink);
          } else {
            on = id(kombi_role).state;
          }
          id(led_gpio).set_state(on);

